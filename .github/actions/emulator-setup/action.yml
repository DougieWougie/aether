name: Emulator host setup
description: Frees disk space and enables KVM so the Android emulator can run on a GitHub-hosted runner.
runs:
  using: composite
  steps:
    - name: Free disk space if needed
      # The emulator's user-data partition needs room; skip the slow rm -rf when the runner already has >= 25 GB free.
      shell: bash
      run: |
        avail_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
        echo "Available disk space: ${avail_gb}G"
        if [ "${avail_gb:-0}" -lt 25 ]; then
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h /
        fi

    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
