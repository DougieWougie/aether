# Keeps the SHA-pinned actions and the Gradle dependencies current. Each update arrives as a pull request that the
# normal CI gate checks. Action SHAs are kept with a "# vX.Y.Z" comment, which Dependabot also updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
