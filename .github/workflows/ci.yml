name: CI

# The pull request gate. The full instrumented suite runs on release branches (release.yml), see ADR-0010.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request supersedes the older run; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect lint-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit, so HEAD^1 is the base branch tip.
          fetch-depth: 2

      - name: Filter paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "lint=true" >> "$GITHUB_OUTPUT"
            echo "smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)

          if grep -qE '^app/src/(main|debug)/|\.gradle\.kts$|^gradle/|^gradle\.properties$|lint.*\.xml$|^\.github/' <<< "$files"; then
            echo "lint=true" >> "$GITHUB_OUTPUT"
          else
            echo "lint=false" >> "$GITHUB_OUTPUT"
          fi

          # The smoke tests cover migrations, the SAF provider and the upload worker, so they matter for anything
          # but the Compose UI and its resources. Instrumented test changes count except the screen tests.
          relevant='^app/src/(main|debug|androidTest)/|^app/schemas/|\.gradle\.kts$|^gradle/|^gradle\.properties$|^\.github/'
          ui_only='^app/src/main/kotlin/com/aether/nextcloud/ui/|^app/src/main/res/(values|drawable|mipmap-anydpi)/|^app/src/androidTest/kotlin/com/aether/nextcloud/ui/screens/'
          if grep -E "$relevant" <<< "$files" | grep -qvE "$ui_only"; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    # A skipped job counts as passing for a required check, so a docs- or test-only change is not blocked.
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew lintDebug

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew testDebugUnitTest

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  smoke:
    name: Instrumented smoke tests
    # Pull requests that touch more than the Compose UI. Main already passed this on its pull request, and
    # release branches run the full suite.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/emulator-setup

      - name: Smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          # Only classes annotated @Smoke (app/src/androidTest/.../support/Smoke.kt).
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.annotation=com.aether.nextcloud.support.Smoke

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  gate:
    name: CI gate
    # The one check to require in the branch ruleset. A job skipped because its dependency failed reports
    # success, so this checks each result explicitly and only accepts a skip where one is expected.
    needs: [changes, lint, unit, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT_NEEDED: ${{ needs.changes.outputs.lint }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          SMOKE_NEEDED: ${{ needs.changes.outputs.smoke }}
          SMOKE: ${{ needs.smoke.result }}
          EVENT: ${{ github.event_name }}
        run: |
          fail=0
          check() { echo "$1: $2"; }
          [ "$CHANGES" = success ] || { check "changes" "$CHANGES (expected success)"; fail=1; }
          [ "$UNIT" = success ] || { check "unit" "$UNIT (expected success)"; fail=1; }
          if [ "$LINT" != success ] && ! { [ "$LINT" = skipped ] && [ "$LINT_NEEDED" = false ]; }; then
            check "lint" "$LINT (needed: $LINT_NEEDED)"; fail=1
          fi
          if [ "$SMOKE" != success ] && ! { [ "$SMOKE" = skipped ] && { [ "$EVENT" != pull_request ] || [ "$SMOKE_NEEDED" = false ]; }; }; then
            check "smoke" "$SMOKE (needed: $SMOKE_NEEDED, event: $EVENT)"; fail=1
          fi
          exit $fail
