name: Release candidate

# The full suite, run on release branches (release/1.4, ...) and on demand. See ADR-0010.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew lintDebug testDebugUnitTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/emulator-setup

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          # Compose screen tests stay out of CI (ADR-0009); run them locally before tagging.
          script: ./gradlew testDebugUnitTest connectedDebugAndroidTest coverageReport -Pandroid.testInstrumentationRunnerArguments.notPackage=com.aether.nextcloud.ui.screens

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/coverage/combined/
          if-no-files-found: ignore
