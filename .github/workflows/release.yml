name: Release candidate

# The full suite, run on release branches (release/1.4, ...) and on demand. See ADR-0010.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Unsigned without keystore secrets; this is here so R8 and resource shrinking run before a release is tagged.
      - run: ./gradlew lintDebug testDebugUnitTest assembleRelease -Pcoverage

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload unit coverage
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: app/build/outputs/unit_test_code_coverage/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One failing API level should not hide the others.
      fail-fast: false
      matrix:
        # minSdk, the level the PR gate uses, and targetSdk.
        api-level: [29, 34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Download unit coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-coverage
          path: app/build/outputs/unit_test_code_coverage/

      # Build both APKs at full CPU before QEMU boots, so Gradle doesn't fight the emulator for cores and RAM.
      - name: Build test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pcoverage

      - name: Cache Android ${{ matrix.api-level }} system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-${{ matrix.api-level }}/google_apis/x86_64
          key: avd-sysimg-${{ matrix.api-level }}-google_apis-x86_64-v1

      - uses: ./.github/actions/emulator-setup

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          # Compose screen tests stay out of CI (ADR-0009); run them locally before tagging.
          script: ./gradlew connectedDebugAndroidTest coverageReport -Pcoverage -Pandroid.testInstrumentationRunnerArguments.notPackage=com.aether.nextcloud.ui.screens

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/coverage/combined/
          if-no-files-found: ignore
